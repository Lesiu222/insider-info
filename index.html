<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insider Info</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--text:#f2f2f0;--dim:#82827e;--line:#232321;--y:#f5c518;--buy:#7fc794;--sell:#e0705f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:1100px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;color:var(--text);text-decoration:none;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.mark{width:14px;height:14px;background:var(--y);border-radius:3px;margin-right:12px}
nav{display:flex;gap:22px}
nav a{color:var(--dim);text-decoration:none;font-size:14px;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);border-color:var(--y)}
main{max-width:1100px;margin:0 auto;padding:56px 24px 40px}
h1{font-size:clamp(36px,7vw,72px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:0 0 16px}
.sub{color:var(--dim);max-width:52ch;margin:0 0 40px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.big{display:flex;flex-direction:column;justify-content:space-between;gap:48px;min-height:260px;padding:26px;border:1px solid var(--line);border-radius:14px;color:var(--text);text-decoration:none;transition:border-color .2s,background .2s}
.big:hover,.big:focus-visible{border-color:var(--y);background:#111110;outline:0}
.big .num{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.big b{display:block;font-size:30px;letter-spacing:-.02em;font-weight:600;margin-bottom:6px}
.big em{font-style:normal;color:var(--dim)}
.cnt{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px}
.cnt i{font-style:normal;font-size:22px;color:var(--text);transition:transform .2s,color .2s}
.big:hover .cnt i{transform:translateX(6px);color:var(--y)}
.pt{font-size:clamp(30px,5vw,48px);margin-bottom:8px}
.tools{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 20px}
input[type=search]{background:transparent;border:1px solid var(--line);color:var(--text);font:inherit;padding:10px 14px;border-radius:10px;min-width:260px}
input[type=search]:focus{outline:0;border-color:var(--y)}
.note{color:var(--dim);font-size:13px;margin:0}
.wrap{overflow-x:auto;border-top:1px solid var(--line);margin-bottom:28px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:12px 14px 12px 0;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
tbody tr:hover{background:#111110}
td.n,th.n{text-align:right}
.buy{color:var(--buy);font-weight:600}.sell{color:var(--sell);font-weight:600}
a{color:var(--y)}
h2{font-size:20px;margin:36px 0 4px;letter-spacing:-.01em}
.empty{padding:36px 0;color:var(--dim)}
footer{max-width:1100px;margin:0 auto;padding:20px 24px 48px;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}
:focus-visible{outline:2px solid var(--y);outline-offset:3px}
</style>
</head>
<body>
<header><div class="hd">
  <a class="logo" href="#" aria-label="Insider Info, strona główna"><span class="mark"></span>Insider Info</a>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<footer>To materiał informacyjny, nie rekomendacja inwestycyjna. Zgłoszenia mają opóźnienie: Form 4 do 2 dni, polityków do 45 dni, 13F do 45 dni po kwartale. Kwoty polityków podawane są w przedziałach.</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd=n=>n?"$"+Math.round(n).toLocaleString("pl-PL"):"";
const typ=t=>/^purchase/i.test(t)?["Kupno","buy"]:/^sale/i.test(t)?["Sprzedaż","sell"]:[t||"",""];
const own={Spouse:"Małżonek",Joint:"Wspólne","Dependent Child":"Dziecko","":"Własne"};
const lnk=u=>/^https:\/\//.test(u||"")?`<a href="${esc(u)}" target="_blank" rel="noopener">źródło</a>`:"";
let D=null,tab="";

const T={
  politicians:{name:"Politycy",desc:"Transakcje senatorów i posłów z Kongresu USA",unit:"transakcji"},
  insiders:{name:"Insiderzy",desc:"Zakupy i sprzedaże zarządów i dyrektorów spółek",unit:"transakcji"},
  funds:{name:"Fundusze",desc:"Portfele największych funduszy z raportów 13F",unit:"funduszy"}
};

const views={
  politicians:{cols:["Zgłoszono","Transakcja","Izba","Polityk","Spółka","Typ","Kwota","Właściciel","",""],
    row:r=>{const [t,c]=typ(r.type);return [r.disclosed,r.tx,r.chamber,`${esc(r.name)} (${esc(r.region)})`,`<b>${esc(r.ticker)}</b>`,`<span class="${c}">${t}</span>`,esc(r.amount),own[r.owner]??esc(r.owner),lnk(r.link),r.dup?'<span class="note" title="Identyczny wpis pojawił się wcześniej. Sprawdź w źródle.">możliwy duplikat</span>':""]},
    text:r=>`${r.name} ${r.ticker} ${r.asset}`},
  insiders:{cols:["Złożono","Transakcja","Spółka","Osoba","Rola","Typ","Akcje","Cena","Wartość",""],
    row:r=>{const [t,c]=typ(r.type);return [r.filed,r.date,`<b>${esc(r.ticker)}</b>`,esc(r.person),esc(r.role),`<span class="${c}">${t}</span>`,Math.round(r.shares).toLocaleString("pl-PL"),r.price?"$"+r.price.toFixed(2):"",usd(r.value),lnk(r.link)]},
    text:r=>`${r.person} ${r.ticker}`, num:[6,7,8]}
};

function table(v,rows){
  if(!rows.length) return '<div class="empty">Brak wyników. Zmień wyszukiwanie albo poczekaj na kolejną aktualizację.</div>';
  const body=rows.slice(0,300).map(r=>`<tr>${v.row(r).map((c,i)=>`<td class="${v.num&&v.num.includes(i)?"n":""}">${c??""}</td>`).join("")}</tr>`).join("");
  return `<div class="wrap"><table><thead><tr>${v.cols.map((c,i)=>`<th class="${v.num&&v.num.includes(i)?"n":""}">${c}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function funds(q){
  const list=D.funds.filter(f=>!q||f.fund.toLowerCase().includes(q)||f.top.some(h=>h.name.toLowerCase().includes(q)));
  if(!list.length) return table(views.insiders,[]);
  return list.map(f=>{
    const rows=f.top.map(h=>`<tr><td>${esc(h.name)}</td><td class="n">${Math.round(h.shares).toLocaleString("pl-PL")}</td><td class="n">${usd(h.value)}</td><td class="n ${h.change==="nowa"||h.change>0?"buy":h.change<0?"sell":""}">${h.change==null?"":h.change==="nowa"?"nowa pozycja":(h.change>0?"+":"")+h.change+"%"}</td></tr>`).join("");
    return `<h2>${esc(f.fund)}</h2><p class="note">Raport za ${esc(f.period)}, złożony ${esc(f.filed)}. Łączna wartość akcji: ${usd(f.total)}. Pokazano 12 największych pozycji.</p><div class="wrap"><table><thead><tr><th>Spółka</th><th class="n">Akcje</th><th class="n">Wartość</th><th class="n">Zmiana od poprzedniego kwartału</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
}

function draw(){
  if(!D||!tab) return;
  const q=($("#q")?.value||"").trim().toLowerCase();
  $("#out").innerHTML=tab==="funds"?funds(q):table(views[tab],D[tab].filter(r=>!q||views[tab].text(r).toLowerCase().includes(q)));
}

function route(){
  const h=location.hash.slice(1);
  tab=T[h]?h:"";
  $("#nav").innerHTML=Object.keys(T).map(k=>`<a href="#${k}" class="${k===tab?"on":""}">${T[k].name}</a>`).join("");
  if(!tab){
    $("#app").innerHTML=`<h1>Czyj ruch<br>chcesz zobaczyć?</h1><p class="sub">Jawne transakcje polityków, insiderów i funduszy z USA w jednym miejscu.</p><div class="grid">${Object.keys(T).map((k,i)=>`<a class="big" href="#${k}"><span class="num">0${i+1}</span><span><b>${T[k].name}</b><em>${T[k].desc}</em></span><span class="cnt">${D?D[k].length+" "+T[k].unit:""}<i>→</i></span></a>`).join("")}</div>`;
    return;
  }
  $("#app").innerHTML=`<h1 class="pt">${T[tab].name}</h1><p class="sub">${T[tab].desc}.</p><div class="tools"><input type="search" id="q" placeholder="Szukaj spółki lub osoby" aria-label="Szukaj"><p class="note">${D?"Ostatnia aktualizacja: "+new Date(D.updated).toLocaleString("pl-PL"):""}</p></div><div id="out"></div>`;
  $("#q").oninput=draw; draw(); window.scrollTo(0,0);
}

addEventListener("hashchange",route);
route();
fetch("data.json").then(r=>r.json()).then(d=>{D=d;route()}).catch(()=>{$("#app").insertAdjacentHTML("beforeend",'<div class="empty">Nie udało się wczytać danych. Uruchom bota w zakładce Actions i odśwież stronę.</div>')});
</script>
</body>
</html>
