name: Aktualizacja danych
on:
  schedule:
    - cron: "30 3 * * 2-6"
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.bot.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: bot
        run: python bot.py
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          POLITICIANS_ENABLED: ${{ vars.POLITICIANS_ENABLED }}
      - run: cp index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  alert:
    needs: [build, deploy]
    if: needs.build.outputs.failed != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Źródła bez świeżych danych: ${{ needs.build.outputs.failed }}"
          exit 1
